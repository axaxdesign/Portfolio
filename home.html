<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.rot = 0.10;
    this.vel = 0;
    this.input = 0;
    this.drag = null;
    this.moved = 0;
    this.front = -1;
  }

  renderVals() {
    return {
      setStage: el => { if (el) this.stageEl = el; }
    };
  }

  // entry: letters scramble and lock left to right on a solid ground that is
  // a different colour every load, then the plate wipes off the ring
  runIntro() {
    const plate = document.querySelector("[data-intro]");
    if (!plate) return;
    if (this.props.intro === false || this._introRan) { plate.remove(); return; }
    this._introRan = true;
    const grounds = [
      ["#E30613", "#F4F3F1"], ["#0D0D0D", "#F1F0EE"], ["#1B4DE4", "#F4F3F1"],
      ["#F2B705", "#0D0D0D"], ["#127A4B", "#F4F3F1"], ["#D9328A", "#F4F3F1"],
      ["#F1F0EE", "#0D0D0D"], ["#3A2BD6", "#F4F3F1"]
    ];
    const g = grounds[Math.floor(Math.random() * grounds.length)];
    plate.style.background = g[0];
    const word = plate.firstElementChild;
    word.style.color = g[1];

    const spans = Array.from(word.querySelectorAll("span"));
    // each slot is pinned to its FINAL letter's natural width, so the word keeps
    // ordinary letterspacing and nothing shifts while the glyphs scramble
    const fsPx = parseFloat(getComputedStyle(word).fontSize) || 16;
    spans.forEach(s => { if (s.dataset.ch !== " ") s.style.width = (s.offsetWidth / fsPx + 0.01).toFixed(4) + "em"; });   // offsetWidth: layout px, immune to the frame's scale
    // a slot only cycles glyphs that fit its own width, so nothing spills into
    // its neighbours while scrambling
    const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#%*+".split("");
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute; visibility:hidden; white-space:pre";
    word.appendChild(probe);
    const gw = {};
    pool.forEach(c => { probe.textContent = c; gw[c] = probe.offsetWidth; });
    probe.remove();
    const narrowest = pool.slice().sort((a, b) => gw[a] - gw[b])[0];
    const fits = spans.map(s => {
      if (s.dataset.ch === " ") return [" "];
      const lim = s.offsetWidth + 0.5;
      const ok = pool.filter(c => gw[c] <= lim);
      return ok.length ? ok : [narrowest];
    });
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const step = 88, lead = 240;
    const done = () => {
      if (this._introOut) return;
      this._introOut = true;
      clearInterval(this._scr);
      spans.forEach(s => { s.textContent = s.dataset.ch === " " ? " " : s.dataset.ch; });
      setTimeout(() => {
        plate.style.transition = "transform .78s cubic-bezier(.76,0,.24,1)";
        plate.style.transform = "translateY(-100%)";
        setTimeout(() => plate.remove(), 820);
      }, 380);
    };
    if (reduce) return done();

    const t0 = performance.now();
    this._scr = setInterval(() => {
      const e = performance.now() - t0;
      let locked = 0;
      spans.forEach((s, i) => {
        if (s.dataset.ch === " ") { locked++; return; }
        if (e > lead + i * step) { s.textContent = s.dataset.ch; locked++; }
        else { const cand = fits[i]; s.textContent = cand[(Math.random() * cand.length) | 0]; }
      });
      if (locked === spans.length) done();
    }, 42);

    const skip = () => done();
    window.addEventListener("pointerdown", skip, { once: true });
    window.addEventListener("keydown", skip, { once: true });
  }

  // one underline for the whole nav: it slides to whatever you hover and
  // returns to the current page's item on leave, so two bars never show at once
  wireUnderline() {
    const nav = document.querySelector("[data-nav-bar]");
    if (!nav) return;
    const links = Array.from(nav.querySelectorAll("a"));
    const bar = nav.querySelector("[data-underline]");
    if (!links.length || !bar) return;
    const home = links.find(a => a.hasAttribute("data-active")) || null;
    const move = (el, instant) => {
      bar.style.transition = instant ? "none" : "transform .42s cubic-bezier(.2,.7,.2,1), width .42s cubic-bezier(.2,.7,.2,1), opacity .25s linear";
      if (!el) { bar.style.opacity = "0"; return; }
      const nr = nav.getBoundingClientRect(), r = el.getBoundingClientRect();
      bar.style.opacity = "1";
      bar.style.width = Math.round(r.width) + "px";
      bar.style.transform = "translateX(" + Math.round(r.left - nr.left) + "px)";
    };
    links.forEach(a => {
      a.addEventListener("pointerenter", () => move(a));
      a.addEventListener("focus", () => move(a));
    });
    nav.addEventListener("pointerleave", () => move(home));
    requestAnimationFrame(() => move(home, true));
    window.addEventListener("resize", () => move(home, true));
  }

  componentDidMount() {
    this.runIntro();
    this.wireContact();
    setTimeout(() => this.wireUnderline(), 0);
    const poll = () => {
      if (this.ready) { this.kick(); return; }
      if (this.stageEl) this.init(this.stageEl);
      if (!this.ready) this.pollRaf = requestAnimationFrame(poll);
    };
    poll();
    // watchdog: a re-render can replace the stage and kill the loop without throwing,
    // so nothing here is gated on this.ready
    this.watch = setInterval(() => {
      this.rebind();
      if (!this.ready && this.stageEl) this.init(this.stageEl);
      if (this.ready && this.raf === null) this.kick();
      // some embeds park requestAnimationFrame; keep the ring moving off the interval
      if (this.ready && performance.now() - (this.lastTick || 0) > 400) {
        try { this.frame(); } catch (err) { console.error("frame error", err); }
      }
    }, 250);
  }

  componentDidUpdate() {
    this.rebind();
    if (this.stageEl) this.init(this.stageEl);
    this.kick();
  }

  // a re-render swaps the template's nodes out from under the cached ones;
  // without this the loop keeps driving elements that are no longer on screen
  rebind() {
    if (!this.items || !this.items.length) return;
    if (this.ready && this.items[0].el.isConnected && this.stageEl && this.stageEl.isConnected) return;
    this.ready = false;
    this.layers = null;
    this.shown = undefined;
    this.front = -1;
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
  }

  // CONTACT opens a blurred sheet: the wordmark rises out of its overflow box,
  // the columns lift in after it
  wireContact() {
    const ov = document.querySelector("[data-contact]");
    const link = document.querySelector("[data-contact-open]");
    if (!ov || !link) return;
    const rise = ov.querySelector("[data-crise]");
    const lines = Array.from(ov.querySelectorAll("[data-cline]"));
    const open = () => {
      ov.style.display = "block";
      void ov.offsetWidth;
      ov.style.opacity = "1";
      if (rise) { rise.style.animation = "none"; void rise.offsetWidth; rise.style.animation = "axCRise 1s cubic-bezier(.16,.9,.2,1) both"; }
      lines.forEach((el, i) => {
        el.style.animation = "none"; void el.offsetWidth;
        el.style.animation = "axCLine .8s " + (0.18 + i * 0.08).toFixed(2) + "s cubic-bezier(.2,.7,.2,1) both";
      });
      this._cOpen = true;
    };
    const close = () => {
      ov.style.opacity = "0";
      this._cOpen = false;
      setTimeout(() => { if (!this._cOpen) ov.style.display = "none"; }, 520);
    };
    link.addEventListener("click", e => { e.preventDefault(); open(); });
    const btn = ov.querySelector("[data-contact-close]");
    if (btn) btn.addEventListener("click", e => { e.preventDefault(); close(); });
    ov.addEventListener("click", e => { if (e.target === ov) close(); });
    window.addEventListener("keydown", e => { if (e.key === "Escape" && this._cOpen) close(); });
  }

  kick() {
    if (this.ready && !this.raf && this.tick) this.raf = requestAnimationFrame(this.tick);
  }

  componentWillUnmount() {
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
    if (this.watch) clearInterval(this.watch);
    if (this.onVis) document.removeEventListener("visibilitychange", this.onVis);
    if (this.pollRaf) cancelAnimationFrame(this.pollRaf);
    if (this.stageEl && this.onWheel) this.stageEl.removeEventListener("wheel", this.onWheel);
  }

  init(stage) {
    if (this.ready) return;
    const found = Array.from(stage.querySelectorAll("[data-i]"));
    if (!found.length) return;
    this.ready = true;
    this.items = found.map(el => ({
      el,
      img: el.querySelector("img"),
      src: el.dataset.src,
      name: el.dataset.name,
      href: el.dataset.href
    }));
    this.card = stage.querySelector("[data-card]");
    this.cName = stage.querySelector("[data-cname]");
    this.cLink = stage.querySelector("[data-clink]");
    this.cImgLink = stage.querySelector("[data-cimglink]");
    this.cImg = stage.querySelector("[data-cimg]");
    if (this.cImg && this.cImgLink) {
      this.layers = this.items.map((it, i) => {
        const im = this.cImg.cloneNode(false);
        im.removeAttribute("data-cimg");
        im.src = it.src;
        im.style.position = "relative";
        im.style.opacity = "1";
        im.style.display = i === 0 ? "block" : "none";
        im.decoding = "sync";
        this.cImgLink.appendChild(im);
        return im;
      });
      this.cImg.style.display = "none";
      this.shown = 0;
    }
    this.step = (Math.PI * 2) / this.items.length;

    stage.addEventListener("pointerdown", e => {
      this.drag = e.clientX;
      this.moved = 0;
      this.input = 0;
      this.vel = 0;
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener("pointermove", e => {
      if (this.drag === null) return;
      const dx = e.clientX - this.drag;
      this.drag = e.clientX;
      this.moved += Math.abs(dx);
      const d = dx * 0.0062 * (this.props.speed ?? 1);   // a thumb covers less ground than a mouse
      this.rot += d;
      this.vel = d;
    });
    const end = () => {
      if (this.drag === null) return;
      this.drag = null;
      if (this.moved < 6) this.vel = 0;
    };
    stage.addEventListener("pointerup", end);
    stage.addEventListener("pointercancel", () => { this.drag = null; });

    this.onWheel = e => {
      e.preventDefault();
      const raw = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      this.input += raw * 0.00045 * (this.props.speed ?? 1);
      const cap = 0.09 * (this.props.speed ?? 1);
      this.input = Math.max(-cap, Math.min(cap, this.input));
    };
    stage.addEventListener("wheel", this.onWheel, { passive: false });

    this.onVis = () => { if (!document.hidden) { this.raf = null; this.kick(); } };
    document.addEventListener("visibilitychange", this.onVis);

    stage.addEventListener("click", e => {
      if (this.moved > 6) { e.preventDefault(); e.stopPropagation(); }
    }, true);

    this.pre = {};
    this.items.forEach(it => { const i = new Image(); i.src = it.src; this.pre[it.src] = i; });

    this.tick = () => {
      this.rebind();
      if (!this.ready) { this.raf = null; if (this.stageEl) this.init(this.stageEl); return; }
      this.lastTick = performance.now();
      try { this.frame(); } catch (err) { console.error("frame error", err); }
      this.raf = requestAnimationFrame(this.tick);
    };
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(this.tick);
  }

  frame() {
    const stage = this.stageEl;
    if (!stage || !this.items) return;
    const vw = stage.clientWidth || 0;
    const vh = stage.clientHeight || 0;
    if (vw < 2 || vh < 2) return;
    const tilt = this.props.tilt ?? 45;
    const thumb = +this.props.thumbSize || 1;
    const swapRad = ((this.props.swapAngle ?? 14) * Math.PI) / 180;
    const ringRot = ((this.props.ringRotate ?? 0) * Math.PI) / 180;
    const ca = Math.cos(ringRot), sa = Math.sin(ringRot);
    const R = Math.max(150, Math.min(vw * 0.47, 470)) * (+this.props.spread || 1);
    const A = R * 0.1136;
    const base = Math.max(44, Math.min(vw * 0.15, 124));
    const IW = base * thumb, IH = base * 1.389 * thumb;

    if (this.drag === null) {
      const ramp = this.props.ramp ?? 0.12;
      const glide = this.props.glide ?? 0.955;
      if (Math.abs(this.input) > Math.abs(this.vel)) this.vel += (this.input - this.vel) * ramp;
      this.input *= 0.86;
      if (Math.abs(this.input) < 0.00002) this.input = 0;
      this.rot += this.vel;
      this.vel *= glide;
      if (Math.abs(this.vel) < 0.00002) this.vel = 0;
      this.rot += (this.props.autoSpin ?? 0.15) * 0.001;
    }

    const TWO = Math.PI * 2;
    let best = 0, bd = Infinity;
    for (let i = 0; i < this.items.length; i++) {
      const it = this.items[i];
      let th = (i * this.step - this.rot) % TWO;
      if (th > Math.PI) th -= TWO;
      if (th < -Math.PI) th += TWO;
      const c = Math.cos(th), sn = Math.sin(th);
      const u = (1 + c) / 2;
      const s = 0.30 + 0.70 * Math.pow(u, 1.5);
      const X0 = R * sn, Y0 = -A * (1 - c);
      const X = X0 * ca - Y0 * sa, Y = X0 * sa + Y0 * ca;
      const op = c > 0.1
        ? 0.96 + 0.04 * u
        : 0.30 + 0.60 * Math.sqrt(Math.min(1, u / 0.30));
      it.el.style.width = IW.toFixed(1) + "px";
      it.img.style.height = IH.toFixed(1) + "px";
      it.el.style.transform = "translate(-50%,-50%) translateX(" + X.toFixed(1) + "px) translateY(" + Y.toFixed(1) + "px) scale(" + s.toFixed(3) + ") perspective(700px) rotateY(" + (tilt * sn).toFixed(2) + "deg) rotate(" + (this.props.ringRotate ?? 0) + "deg)";
      it.el.style.opacity = op.toFixed(3);
      it.el.style.zIndex = c > 0.1 ? "3" : "0";
      const d = Math.abs(th);
      if (d < bd) { bd = d; best = i; }
    }

    if (best !== this.front && (this.front === -1 || bd < swapRad)) {
      this.front = best;
      const it = this.items[best];
      if (this.layers) {
        if (this.shown !== undefined && this.layers[this.shown]) this.layers[this.shown].style.display = "none";
        const nx = this.layers[best];
        nx.style.transition = "none";
        nx.style.opacity = "1";
        nx.style.display = "block";
        this.shown = best;
      }
      if (this.cName) this.cName.textContent = it.name;
      if (this.cLink) this.cLink.href = it.href;
      if (this.cImgLink) this.cImgLink.href = it.href;
    }
    if (this.card) {
      const ar = +this.props.cardAspect || 0.86;
      const ch = Math.min(vh * 0.42, (vw * 0.66) / ar) * (+this.props.cardSize || 1);
      this.card.style.width = (ch * ar).toFixed(1) + "px";
      this.card.style.transform = "translate(-50%,-50%) translateY(" + (vh * (this.props.cardY ?? 0) / 100).toFixed(1) + "px)";
      const bar = this.card.firstElementChild;
      if (bar) bar.style.display = (this.props.cardBar === false) ? "none" : "flex";
      if (this.layers) this.layers.forEach(im => { im.style.aspectRatio = ar + " / 1"; });
    }
  }
}
</script>
</body>
</html>
